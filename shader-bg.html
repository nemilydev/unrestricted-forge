<!DOCTYPE html>
<html>
<head>
<style>
  body { margin: 0; overflow: hidden; background: #000; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
const cv = document.getElementById('c');
const gl = cv.getContext('webgl', { preserveDrawingBuffer: true });

const vs = `
attribute vec2 p;
void main() { gl_Position = vec4(p, 0.0, 1.0); }
`;

const fs = `
precision highp float;
uniform float uTime;
uniform vec2 uRes;

float hash(vec2 p) {
  p = fract(p * vec2(123.34, 456.21));
  p += dot(p, p + 45.32);
  return fract(p.x * p.y);
}

float noise(vec2 p) {
  vec2 i = floor(p);
  vec2 f = fract(p);
  f = f * f * (3.0 - 2.0 * f);
  float a = hash(i);
  float b = hash(i + vec2(1.0, 0.0));
  float c = hash(i + vec2(0.0, 1.0));
  float d = hash(i + vec2(1.0, 1.0));
  return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
}

float fbm(vec2 p) {
  float v = 0.0;
  float a = 0.5;
  for (int i = 0; i < 6; i++) {
    v += a * noise(p);
    p *= 2.0;
    a *= 0.5;
  }
  return v;
}

void main() {
  vec2 uv = gl_FragCoord.xy / uRes;
  vec2 p = uv * 4.0;

  // domain warping — the good stuff
  vec2 q = vec2(
    fbm(p),
    fbm(p + vec2(5.2, 1.3))
  );
  vec2 r = vec2(
    fbm(p + 4.0 * q + vec2(1.7, 9.2)),
    fbm(p + 4.0 * q + vec2(8.3, 2.8))
  );
  float n = fbm(p + 4.0 * r);

  // amber palette — deep ember to warm gold
  vec3 c1 = vec3(0.04, 0.03, 0.02);   // near black, warm
  vec3 c2 = vec3(0.12, 0.08, 0.04);   // dark amber
  vec3 c3 = vec3(0.35, 0.22, 0.10);   // mid amber
  vec3 c4 = vec3(0.55, 0.38, 0.18);   // warm gold
  vec3 c5 = vec3(0.72, 0.52, 0.28);   // bright amber

  float t = n;
  vec3 col = mix(c1, c2, smoothstep(0.0, 0.35, t));
  col = mix(col, c3, smoothstep(0.35, 0.55, t));
  col = mix(col, c4, smoothstep(0.55, 0.75, t));
  col = mix(col, c5, smoothstep(0.75, 0.95, t));

  // vignette — darker edges for a background texture
  vec2 v = uv - 0.5;
  float vig = 1.0 - dot(v, v) * 0.8;
  col *= vig;

  // subtle grain
  col += (hash(uv * 999.0 + uTime) - 0.5) * 0.02;

  gl_FragColor = vec4(col, 1.0);
}
`;

function compile(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
    console.error(gl.getShaderInfoLog(s));
  }
  return s;
}

const prog = gl.createProgram();
gl.attachShader(prog, compile(gl.VERTEX_SHADER, vs));
gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, fs));
gl.linkProgram(prog);
gl.useProgram(prog);

const buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
const loc = gl.getAttribLocation(prog, 'p');
gl.enableVertexAttribArray(loc);
gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

gl.uniform2f(gl.getUniformLocation(prog, 'uRes'), cv.width, cv.height);
gl.uniform1f(gl.getUniformLocation(prog, 'uTime'), 0.0);

gl.viewport(0, 0, cv.width, cv.height);
gl.clearColor(0, 0, 0, 1);
gl.clear(gl.COLOR_BUFFER_BIT);
gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
</script>
</body>
</html>
